version: '3.8'
services:
  server:
    build: ./packages/server
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=sqlite+aiosqlite:///./easyhome.db
    volumes:
      - ./data:/app/data
    depends_on:
      - redis
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
